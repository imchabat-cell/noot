name: Build Intel macOS App
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 App Bundle
        run: |
          sed -i '' 's/swift build -c release/swift build -c release --arch x86_64/g' build-app.sh
          chmod +x build-app.sh
          ./build-app.sh
      - name: Upload Compiled Intel App
        uses: actions/upload-artifact@v4
        with:
          name: Noot-Intel-x86_64
          path: ~/Applications/Noot.app
